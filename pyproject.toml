[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "editforge"
version = "1.0.0"
description = "A free, local, open-source video-editing engine with a CLI and a simple web page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
faces = ["opencv-python-headless>=4.8"]

[project.scripts]
editforge = "editforge.cli.main:main"

[tool.setuptools.packages.find]
include = ["editforge*"]

[tool.setuptools.package-data]
editforge = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
